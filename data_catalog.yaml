# Data Catalog for legoESM-ocean-runners
#
# This file is the single source of truth for external data files needed by
# experiment templates. Each entry describes a downloadable (or transferable)
# data artifact with enough information to fetch, verify, and use it.
#
# Template YAML files reference these entries by ID in their `requires` field.
# The scripts/fetch_data.py tool uses this catalog to download, verify, and
# check data availability.
#
# Path conventions:
#   - All `path` fields are relative to DATA_ROOT (set per-machine or via $LEGOESM_DATA_DIR)
#   - DATA_ROOT defaults to ./data (relative to this repo)
#   - For Zarr datasets, path points to the Zarr directory
#
# Access levels:
#   - "public": Direct HTTP/HTTPS download
#   - "globus": Requires Globus transfer (instructions provided)
#   - "institutional": Requires institutional access / registration
#   - "derived": Must be built from other catalog entries (build_script provided)

