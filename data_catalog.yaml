    description: JRA55-do v1.4 OMIP-2 forcing cache (1958-2018 interannual, 1-deg noleap, 3-hourly) — the prepare_omip_forcing.py builder store consumed by run_omip2.py --jra55-cache (forcing years 2000-2029 cycle back into the cache window)
    path: jra55_ryf_cache/jra55_do_v14_omip2_1deg_noleap.zarr/
    access: derived
    build_from:
    - jra55_iaf_raw
    build_script: ../legoESM/scripts/data/prepare_omip_forcing.py
    build_instructions: '1. Fetch raw JRA55-do v1.4+ "corrected" data (see
      jra55_iaf_raw)

      2. Run from the legoESM checkout: python scripts/data/prepare_omip_forcing.py
      --source <raw-zarr> --years 1958 2018 --target-resolution-deg 1.0
      --cache-dir DATA_ROOT/jra55_ryf_cache/

      3. ~30 GB; the store lands as jra55_do_v14_omip2_1deg_noleap.zarr
      (conservatively regridded to the target grid; the model grid need not
      match)

      '
    sha256: pending
    size_mb: 30000
    format: Zarr
    variables:
    - uas
    - vas
    - tas
    - huss
    - psl
    - rsds
    - rlds
    - prra
    - prsn
    - friver
    citation: Tsujino et al. 2018, doi:10.2208/prog.2018-006
    license: open (JRA55-do; research use, courtesy attribution JMA)
