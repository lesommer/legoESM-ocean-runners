# Global OMIP at cubed-sphere resolution
# OMIP on a cubed-sphere grid (stress-testing the CS ocean).
#
# Maps to: legoesm run_omip.py --grid cubed_sphere
# Grid:    cubed_sphere
# Mode:    3d_ocean_realistic

experiment:
  name: omip_cubed_sphere
  mode: 3d_ocean_realistic
  description: "OMIP on a cubed-sphere grid (C48)"

requires:
  - etopo1_1deg
  - woa18_annual_t
  - woa18_annual_s
  - jra55_do_ryf

grid:
  type: cubed_sphere
  resolution: 48
  nlev: 50

ocean:
  A_h: 5.0e4
  tracer_advection: tvd
  gm_redi:
    kappa_GM: 1000.0
    kappa_Redi: 1000.0
  eos: wright

bathymetry:
  source: realistic
  H_max: 5500.0

physics:
  vertical_mixing:
    scheme: kpp
  surface_forcing:
    scheme: restoring
    restoring:
      tau_T: 2592000.0
      tau_S: 2592000.0
  bottom_drag:
    scheme: linear
    r: 1.1e-3

time:
  duration_days: 365
  dt_seconds: 1800

output:
  diag_interval_hours: 24
  checkpoint_interval_days: 30