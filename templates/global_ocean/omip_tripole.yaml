experiment:
  name: omip_tripole
  mode: 3d_ocean_realistic
  description: "OMIP on tripolar grid (eORCA1) with COREv2 NYF forcing"

requires:
  - eorca1_mesh
  - woce_ic_t
  - woce_ic_s
  - sss_climatology
  - core2_nyf

requires_patches:
  - 002-omip-core2-extensions.patch
  - 003-mpi-boundary-ops.patch
  - 004-omip-core2-mpi.patch

mpi:
  enabled: false
  ranks: 1
  launcher: mpirun
  extra_args: ""

grid:
  type: tripole
  resolution: eORCA1
  mesh_file: eORCA1.2_mesh_mask.nc
  nlev: 75
  partial_cells: true

ocean:
  smag_cfl_safety: 0.125
  adaptive_implicit_vertadv: true

scan:
  block_size: 0

initial_conditions:
  type: woce

physics:
  convection: enhanced_diffusion
  vertical_mixing:
    scheme: kpp
  lateral_mixing:
    scheme: gm_redi
    enabled: true
  shortwave_penetration:
    water_type: "II"
  sss_restoring:
    enabled: true
    tau_days: 60.0

forcing:
  mode: core2_nyf
  synthetic: false
  scale: 1.0

time:
  duration_days: 3650
  dt_seconds: 1200
