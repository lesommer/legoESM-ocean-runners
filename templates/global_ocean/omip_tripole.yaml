experiment:
  name: omip_tripole
  mode: 3d_ocean_realistic
  description: "OMIP on tripolar grid (eORCA1) with COREv2 NYF forcing"

requires:
  - domain_cfg
  - woce_ic_t
  - woce_ic_s
  - sss_climatology
  - core2_nyf
  - eorca1_mesh

requires_patches:
  - 001-omip-tripole-script.patch
  - 002-omip-tripole-physics.patch
  - 003-tripolar-mpi-halo.patch
  - 004-omip-tripole-mpi.patch
  - 005-mpi-boundary-ops.patch

mpi:
  enabled: false
  ranks: 1
  launcher: mpirun
  extra_args: ""

grid:
  type: tripole
  resolution: eORCA1
  fold_convention: n_lon-1-i
  nlev: 75

ocean:
  smag_cfl_safety: 0.125
  adaptive_implicit_vertadv: true

initial_conditions:
  type: nemo_woce

physics:
  vertical_mixing:
    scheme: kpp
  lateral_mixing:
    scheme: gm_redi
    enabled: true
  shortwave_penetration:
    water_type: "II"
  sss_restoring:
    enabled: true

forcing:
  mode: core2_nyf
  synthetic: false
  scale: 1.0
  runoff:
    enabled: true

time:
  duration_days: 3650
  dt_seconds: 1200
