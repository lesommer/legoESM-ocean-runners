# Neverworld2 Lite (idealized Southern Ocean + basins)
# Simplified global ocean geometry mimicking Neverworld2 benchmark.
# Tests GM/Redi, western boundary currents, and Southern Ocean dynamics.
#
# Maps to: legoesm.ocean.experiments.neverworld2_lite
# Grid:    latlon
# Mode:    3d_ocean

experiment:
  name: neverworld2_lite
  mode: 3d_ocean
  description: "Neverworld2 Lite: idealized global ocean benchmark"

requires: []

grid:
  type: latlon
  # Upstream matrix-lane design resolution (neverworld2_lite latlon arm).
  resolution: 180x360
  nlev: 50

ocean:
  case: neverworld2_lite
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 5.0e4
  C_smag: 0.06
  C_leith: 0.04
  bottom_drag_r: 1.1e-3
  tracer_advection: tvd
  gm_redi:
    kappa_GM: 1000.0
    kappa_Redi: 500.0
    S_max: 0.01
  eos: wright

domain:
  H_max: 4500.0

physics:
  vertical_mixing:
    scheme: kpp
    kpp:
      Ri_crit: 0.3
      Cv: 1.6
      K_conv: 1.0
  surface_forcing:
    scheme: prescribed
    wind_profile: "neverworld2"
  bottom_drag:
    scheme: linear
    r: 1.1e-3

time:
  # Lane-design pair: 365 d at dt 300 (upstream quick gate = 5 d).
  # dt = upstream matrix-lane DEFAULT_DT (stability-verified). Larger dt
  # values forwarded via --dt override the lane design and risk blowup
  # (same latent-bug class as baroclinic_gyre, 2026-10-10).
  duration_days: 365
  dt_seconds: 300

output:
  diag_interval_hours: 24
  checkpoint_interval_days: 365