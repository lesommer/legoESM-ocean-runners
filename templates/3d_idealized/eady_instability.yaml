# Eady instability (baroclinic instability on an f-plane)
# Classic baroclinic instability test with uniform stratification.
#
# Maps to: legoesm.ocean.experiments.eady_instability
# Grid:    latlon (dispatches to the upstream latlon_channel lane)
# Mode:    3d_ocean
#
# 2026-10-10 surgery: the template previously declared `case: eady_uniform`
# with a latlon 64x128 grid — a name/case mismatch, and both eady lanes are
# latlon_channel-only in the upstream matrix. Now filename-consistent and
# aligned to the upstream lane design (latlon_channel 24x72, dt 300, 60 d).

experiment:
  name: eady_instability
  mode: 3d_ocean
  description: "Eady baroclinic instability test"

requires: []

grid:
  type: latlon
  # Upstream matrix-lane design resolution (eady_instability latlon_channel
  # arm; mpas_channel is known to blow up, upstream excludes it).
  resolution: 24x72
  nlev: 50

ocean:
  case: eady_instability
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: legoesm_linear_v1
  A_h: 1.0e2
  K_h: 1.0e2
  eos: linear
  eos_linear:
    rho_ref: 1026.0
    alpha_T: 2.0e-4
    T_reference: 4.0

domain:
  lat_south: -50.0
  lat_north: -30.0
  lon_west: 0.0
  lon_east: 18.0
  H_max: 3000.0

physics:
  vertical_mixing:
    scheme: constant
    constant:
      A_v: 1.0e-3
      K_v: 1.0e-5
  surface_forcing:
    scheme: none
  bottom_drag:
    scheme: linear
    r: 1.1e-3

time:
  # Lane-design pair: 60 d at dt 300 (upstream quick gate = 5 d).
  # dt = upstream matrix-lane DEFAULT_DT (stability-verified). Larger dt
  # values forwarded via --dt override the lane design and risk blowup
  # (same latent-bug class as baroclinic_gyre, 2026-10-10).
  duration_days: 60
  dt_seconds: 300

output:
  diag_interval_hours: 12
  checkpoint_interval_days: 10