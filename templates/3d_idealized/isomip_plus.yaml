# ISOMIP+ (Ice Shelf Ocean Model Intercomparison Project Plus)
# Tests ice-ocean interaction under an ice shelf.
#
# Maps to: legoesm.ocean.experiments.isomip_plus
# Grid:    latlon (regional)
# Mode:    3d_ocean

experiment:
  name: isomip_plus
  mode: 3d_ocean
  description: "ISOMIP+: ice shelf-ocean interaction"

requires: []

grid:
  type: latlon
  # Upstream matrix-lane design resolution (isomip_plus latlon_regional arm).
  resolution: 32x16
  nlev: 10

ocean:
  case: isomip_plus
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 1.0e4

domain:
  # ISOMIPPlusConfig.H_max (the cavity floor depth; Asay-Davis 2016 Fig. 1).
  H_max: 720.0

physics:
  vertical_mixing:
    scheme: constant
    constant:
      A_v: 1.0e-3
      K_v: 1.0e-4
  surface_forcing:
    scheme: none

time:
  # Lane-design pair: 365 d at dt 300 (upstream quick gate = 5 d).
  # dt = upstream matrix-lane DEFAULT_DT (stability-verified). Larger dt
  # values forwarded via --dt override the lane design and risk blowup
  # (same latent-bug class as baroclinic_gyre, 2026-10-10).
  duration_days: 365
  dt_seconds: 300

output:
  diag_interval_hours: 6
  checkpoint_interval_days: 10
