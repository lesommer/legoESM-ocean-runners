# Geostrophic adjustment (2D→3D transition test)
# Tests the adjustment of an unbalanced density front to geostrophic balance.
#
# Maps to: legoesm.ocean.experiments.geostrophic_adjustment
# Grid:    latlon
# Mode:    3d_ocean

experiment:
  name: geostrophic_adjustment
  mode: 3d_ocean
  description: "Geostrophic adjustment of an unbalanced density front"

requires: []

grid:
  type: latlon
  resolution: 64x64
  nlev: 20

ocean:
  case: geostrophic_adjustment
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 1.0e2
  K_h: 1.0e2
  eos: wright

domain:
  H_max: 2000.0

physics:
  vertical_mixing:
    scheme: constant
  surface_forcing:
    scheme: none
  bottom_drag:
    scheme: none

time:
  duration_days: 10
  dt_seconds: 300

output:
  diag_interval_hours: 6
  checkpoint_interval_days: 5