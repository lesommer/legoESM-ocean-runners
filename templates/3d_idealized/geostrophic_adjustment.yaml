# Geostrophic adjustment (2D→3D transition test)
# Tests the adjustment of an unbalanced density front to geostrophic balance.
#
# Maps to: legoesm.ocean.experiments.geostrophic_adjustment
# Grid:    latlon
# Mode:    3d_ocean

experiment:
  name: geostrophic_adjustment
  mode: 3d_ocean
  description: "Geostrophic adjustment of an unbalanced density front"

grid:
  type: latlon
  resolution: 64x64
  nlev: 20

ocean:
  case: geostrophic_adjustment
  A_h: 1.0e2
  K_h: 1.0e2
  eos: linear
  eos_linear:
    rho_ref: 1025.0
    alpha_T: 2.0e-4
    T_reference: 10.0

domain:
  H_max: 2000.0

physics:
  vertical_mixing:
    scheme: constant
  surface_forcing:
    scheme: none
  bottom_drag:
    scheme: none

time:
  duration_days: 10
  dt_seconds: 300

output:
  diag_interval_hours: 6
  checkpoint_interval_days: 5