# Baroclinic gyre (3D, idealized basin)
# Wind-driven double-gyre with baroclinic instability.
# The primary workhorse for 3D ocean validation.
#
# Maps to: legoesm.ocean.experiments.baroclinic_gyre
# Grid:    latlon or cubed_sphere
# Mode:    3d_ocean

experiment:
  name: baroclinic_gyre
  mode: 3d_ocean
  description: "Wind-driven baroclinic gyre with baroclinic instability"

requires: []

grid:
  type: latlon
  resolution: 64x128
  nlev: 50

ocean:
  case: baroclinic_gyre
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 5.0e5
  K_h: 0.0
  bottom_drag_r: 1.1e-3
  tracer_advection: tvd
  gm_redi:
    kappa_GM: 1000.0
    kappa_Redi: 1000.0
    S_max: 0.01
    slope_scheme: triads
  eos: wright

domain:
  lon_west: 0.0
  lon_east: 120.0
  lat_south: 15.0
  lat_north: 75.0
  H_max: 5500.0

physics:
  vertical_mixing:
    scheme: richardson
    richardson:
      K_0: 5.0e-3
      alpha: 5.0
      n: 2
      K_bg: 1.0e-5
  surface_forcing:
    scheme: prescribed
    tau_x: 0.3
    wind_profile: "double_gyre_sin2"
    wind_buffer_deg: 5.0
  bottom_drag:
    scheme: linear
    r: 1.1e-3

initial_conditions:
  T_water_init_C: 20.0
  T_deep: 2.0
  scale_depth: 1000.0
  S_uniform: 35.0

time:
  duration_days: 365
  # dt = upstream matrix-lane DEFAULT_DT (stability-verified). A larger dt
  # here is forwarded as --dt and destabilizes the lane: 1800 blew up at
  # day 0.6 (exponential eta growth to NaN, reproduced Mac CPU + bigfoot
  # V100, 2026-10-10).
  dt_seconds: 300

output:
  diag_interval_hours: 24
  checkpoint_interval_days: 30