# AIMIP: SFNO replaces grid-space physics
# AIMIP with spectral Fourier Neural Operator as full physics emulator.
#
# Maps to: legoesm AIMIP variant_sfno
# Grid:    cubed_sphere
# Mode:    atmosphere_only_aimip

experiment:
  name: aimip_sfno
  mode: atmosphere_only_aimip
  description: "AIMIP: SFNO global emulator"
  template: amip

requires:
  - rrtmgp_gas_lw
  - rrtmgp_gas_sw
  - rrtmgp_cloud_lw
  - rrtmgp_cloud_sw
  - hadisst_sst
  - hadisst_sic
  - cmip6_ghg
  - cmip6_ozone
  - era5_monthly

grid:
  type: cubed_sphere
  resolution: 48
  n_levels: 40

atmosphere:
  dynamics: hydrostatic
  discretization: cdgrid
  dt_seconds: 600

physics_parameterization: sfno
physics_parameterization_checkpoint: ""

time:
  duration_days: 365
  start_year: 1979
  end_year: 2014

output:
  format: zarr
  monthly_means: true