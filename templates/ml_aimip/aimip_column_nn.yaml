# AIMIP: per-column neural network parameterization
# AIMIP with neural network parameterizations replacing grid-scale physics.
#
# Maps to: legoesm AIMIP variant_column_nn
# Grid:    cubed_sphere
# Mode:    atmosphere_only_aimip

experiment:
  name: aimip_column_nn
  mode: atmosphere_only_aimip
  description: "AIMIP: per-column MLP neural physics"
  template: amip

requires:
  - rrtmgp_gas_lw
  - rrtmgp_gas_sw
  - rrtmgp_cloud_lw
  - rrtmgp_cloud_sw
  - hadisst_sst
  - hadisst_sic
  - cmip6_ghg
  - cmip6_ozone
  - era5_monthly

grid:
  type: cubed_sphere
  resolution: 48
  n_levels: 40

atmosphere:
  dynamics: hydrostatic
  discretization: cdgrid
  dt_seconds: 600

physics_parameterization: column_mlp
physics_parameterization_hidden_dim: 128
physics_parameterization_layers: 3

convection: none
turbulence: none
clouds: none

time:
  duration_days: 365
  start_year: 1979
  end_year: 2014

output:
  format: zarr
  monthly_means: true