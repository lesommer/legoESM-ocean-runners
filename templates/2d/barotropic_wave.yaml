# Barotropic gravity wave (2D)
# Gaussian SSH perturbation propagating on a resting ocean.
#
# Maps to: legoesm.ocean.experiments.barotropic_wave (upstream matrix lane)
# Grid:    latlon (dispatches to the upstream latlon lane)
# Mode:    barotropic_ocean
#
# Lane design (upstream matrix): latlon 48x72, 2 d at dt 300 (quick 0.2 d).
# The upstream runner owns the scientifically-validated configuration
# (geometry, ICs, gates); template physics fields are documented intent.

experiment:
  name: barotropic_wave
  mode: barotropic_ocean
  description: "Barotropic gravity wave from a Gaussian SSH perturbation"

requires: []

grid:
  type: latlon
  # Upstream matrix-lane design resolution (barotropic_wave latlon arm).
  resolution: 48x72
  nlev: 10

ocean:
  case: barotropic_wave
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 1.0e2
  K_h: 1.0e2
  eos: wright

domain:
  H_max: 4000.0

physics:
  vertical_mixing:
    scheme: constant
  surface_forcing:
    scheme: none
  bottom_drag:
    scheme: linear
    r: 1.1e-3

time:
  # Lane-design pair: 2 d at dt 300 (upstream quick gate = 0.2 d).
  # dt = upstream matrix-lane DEFAULT_DT (stability-verified). Larger dt
  # values forwarded via --dt override the lane design and risk blowup
  # (same latent-bug class as baroclinic_gyre, 2026-10-10).
  duration_days: 2
  dt_seconds: 300

output:
  diag_interval_hours: 6
  checkpoint_interval_days: 1
