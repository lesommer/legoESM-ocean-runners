# Inertia-gravity wave test (2D shallow water)
# Tests wave propagation on an f-plane or beta-plane.
#
# Maps to: legoesm.ocean.experiments.inertia_gravity_wave
# Grid:    latlon or cubed_sphere, 1 vertical level
# Mode:    barotropic_ocean

experiment:
  name: inertia_gravity_wave
  mode: barotropic_ocean
  description: "Inertia-gravity wave propagation test"

requires: []

grid:
  type: latlon
  resolution: 64x128
  nlev: 1

ocean:
  case: inertia_gravity_wave
  # Scheme identity = the upstream matrix case's verified recipe tag
  # (recipe_map.EXPERIMENT_RECIPES); NOT forwarded — the upstream baseline
  # assembles it. Other ocean.* scheme fields are documented intent.
  recipe: default_wright_v1
  A_h: 1.0e4
  eos: wright

domain:
  H_max: 4500.0
  land_lat_threshold: 90.0

surface_forcing:
  scheme: none

time:
  duration_days: 10
  dt_seconds: 300

output:
  diag_interval_hours: 6
  checkpoint_interval_days: 5