# Ocean lane dispositions — the data behind the lane screening gate (issue #10)
#
# EVERY ocean-relevant lane in the pinned legoESM carries exactly one
# disposition here. scripts/validate_templates.py::check_ocean_lane_coverage()
# enumerates the pinned surface IMPORT-FREE (AST parse of the matrix
# dispatch + file-path-loaded recipe catalogs + script import scan + template
# glob) and FAILS validation (pin bumps + CI Tier-2) on:
#   * an enumerated lane with no entry (exact, or prefix for script/template),
#   * an entry matching no enumerated lane (stale),
#   * a matrix entry whose recorded grid set drifted from the pinned
#     TestCase grid set,
#   * schema violations (unknown status; declined without reason).
# The weekly sync-check enumerates upstream main in warn-only mode
# (validate_templates.py --lanes-warn) and warns about lanes that will need
# a disposition at the next pin bump.
#
# Key = "<namespace>:<id>". Namespaces:
#   matrix:<case>            - run_ocean_test_matrix.py RUNNERS dispatch cases
#                              (grids = the pinned TestCase arm set; the gate
#                              fails on drift)
#   recipe:<name>            - recipes.py LATLON_RECIPES + MPAS_RECIPES keys
#   experiment_recipe:<case> - recipe_map.py EXPERIMENT_RECIPES keys (mirror
#                              the owning case's matrix disposition)
#   script:<path>            - ocean-relevant scripts (AST import scan of
#                              scripts/run/**.py + explicit SW inclusions);
#                              a trailing "/" declares a PREFIX entry
#   template:<cat>/<stem>    - config/templates/**.yaml (ALL categories);
#                              a trailing "/" declares a PREFIX entry
#
# Status vocabulary:
#   onboarded      - runners run lane exists (matrix dispatch); receipt recorded
#   graduated      - onboarded + template resolved from the pinned upstream
#                    library (canonical ocean/<stem>, legacy alias map)
#   upstream_only  - init via ocean/<stem> works; receipts are upstream's business
#   delegation     - served by a dedicated delegation lane (dino, bench)
#   declined       - out of scope / variant / defect - reason REQUIRED
#   backlog        - pending onboarding (issue #10 tiers)
#
# Onboarding workflow: flip the case's matrix: + experiment_recipe: entries
# (and the owning template: entry when one exists) in the same commit as the
# wiring + receipt, then sync_legoesm.sh --tag-only.

