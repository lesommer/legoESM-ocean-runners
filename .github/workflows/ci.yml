name: Validate Templates

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'runners/**'
      - 'scripts/**'
      - 'legoESM_version.txt'
      - 'data_catalog.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

jobs:
  # Tier 1: Structural validation (no legoESM access needed)
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate template YAML structure
        run: python scripts/validate_templates.py --skip-imports --verbose

      - name: Validate data catalog
        run: |
          python -c "
          import yaml
          with open('data_catalog.yaml') as f:
              catalog = yaml.safe_load(f)
          assert 'files' in catalog
          for fid, entry in catalog['files'].items():
              assert 'description' in entry, f'{fid}: missing description'
              assert 'path' in entry, f'{fid}: missing path'
              assert 'access' in entry, f'{fid}: missing access'
              assert 'format' in entry, f'{fid}: missing format'
          print(f'Catalog OK: {len(catalog[\"files\"])} entries')
          "

      - name: Validate template requires reference catalog
        run: |
          python -c "
          import yaml
          from pathlib import Path
          with open('data_catalog.yaml') as f:
              catalog = yaml.safe_load(f)
          catalog_ids = set(catalog['files'].keys())
          errors = []
          for tmpl in Path('templates').rglob('*.yaml'):
              with open(tmpl) as f:
                  config = yaml.safe_load(f)
              for req in config.get('requires', []):
                  if req not in catalog_ids:
                      errors.append(f'{tmpl.name}: requires \"{req}\" not in catalog')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              raise SystemExit(1)
          print('All template requires reference valid catalog entries')
          "

      - name: Check for reproducibility tag
        run: |
          UNTAGGED=$(git log --oneline HEAD --not --tags='legoesm-*' | head -1)
          if [ -n "$UNTAGGED" ]; then
            echo "::warning::HEAD is not covered by a legoesm-* tag. Untagged commit(s) found."
            echo "  First untagged: $UNTAGGED"
            echo "  Run: bash scripts/sync_legoesm.sh --tag-only"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo ""
              echo "ERROR: Pushes to main must be covered by a legoesm-* tag."
              echo "Reproducibility chain is broken — experiment.tag would record runner_tag=untagged."
              exit 1
            fi
          else
            echo "HEAD is covered by a legoesm-* tag."
          fi

      - name: Remind to tag on reproducibility-affecting changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGES=$(git diff --name-only origin/main...HEAD -- 'patches/' 'templates/' 'runners/' 2>/dev/null || true)
          if [ -n "$CHANGES" ]; then
            echo "::notice::This PR modifies reproducibility-affecting paths. A legoesm-* tag must be created after merge."
            echo "  Affected files:"
            echo "$CHANGES" | while read -r f; do echo "    $f"; done
            echo "  After merge, run: bash scripts/sync_legoesm.sh --tag-only [--push]"
          fi

  # Tier 2: Full validation against legoESM (requires PAT access)
  validate-against-legoesm:
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Check legoESM access
        id: check-access
        env:
          LEGOSM_TOKEN: ${{ secrets.LEGOESM_ACCESS_TOKEN }}
        run: |
          if [ -n "$LEGOSM_TOKEN" ]; then
            echo "has_access=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_access=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LEGOESM_ACCESS_TOKEN not set — skipping legoESM validation"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check-access.outputs.has_access == 'true'
        run: |
          pip install --upgrade pip
          pip install pyyaml

      - name: Read pinned legoESM version
        if: steps.check-access.outputs.has_access == 'true'
        id: legoesm
        run: |
          REF=$(grep '^ref:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          COMMIT=$(grep '^commit:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout legoESM
        if: steps.check-access.outputs.has_access == 'true'
        uses: actions/checkout@v4
        with:
          repository: gentine/legoESM
          ref: ${{ steps.legoesm.outputs.ref }}
          path: legoESM
          fetch-depth: 0
          token: ${{ secrets.LEGOESM_ACCESS_TOKEN }}

      - name: Verify legoESM commit
        if: steps.check-access.outputs.has_access == 'true'
        run: |
          ACTUAL=$(cd legoESM && git rev-parse HEAD)
          EXPECTED=${{ steps.legoesm.outputs.commit }}
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "WARNING: Commit mismatch. Using HEAD of ref."
          fi

      - name: Apply patches (if any)
        if: steps.check-access.outputs.has_access == 'true'
        run: bash scripts/apply_patches.sh --check || true

      - name: Install legoESM + JAX
        if: steps.check-access.outputs.has_access == 'true'
        run: |
          pip install -e legoESM/
          pip install jax jaxlib
        continue-on-error: true

      - name: Validate templates against legoESM (full)
        if: steps.check-access.outputs.has_access == 'true'
        run: python scripts/validate_templates.py --legoesm-dir legoESM --verbose

      - name: Run smoke test (one template)
        if: steps.check-access.outputs.has_access == 'true'
        run: |
          python scripts/init_experiment.py 1d/ocean_scm --name ci_smoke_test

  # Scheduled check for legoESM updates (requires PAT)
  sync-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Check for legoESM updates
        env:
          GH_TOKEN: ${{ secrets.LEGOESM_ACCESS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LEGOESM_ACCESS_TOKEN not set — cannot check for legoESM updates"
            exit 0
          fi
          PINNED=$(grep '^commit:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          LATEST=$(git ls-remote https://x-access-token:${GH_TOKEN}@github.com/gentine/legoESM.git refs/heads/main | cut -f1)
          echo "Pinned:  $PINNED"
          echo "Latest:  $LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning::legoESM has been updated. Run scripts/sync_legoesm.sh and validate templates."
          fi