name: Validate Templates

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'runners/**'
      - 'scripts/**'
      - 'legoESM_version.txt'
      - 'data_catalog.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

jobs:
  # Tier 1: Structural validation (no legoESM access needed)
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the reproducibility-tag check needs git tags
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate template YAML structure
        run: python scripts/validate_templates.py --skip-imports --verbose

      - name: Validate data catalog
        run: |
          python -c "
          import yaml
          with open('data_catalog.yaml') as f:
              catalog = yaml.safe_load(f)
          assert 'files' in catalog
          for fid, entry in catalog['files'].items():
              assert 'description' in entry, f'{fid}: missing description'
              assert 'path' in entry, f'{fid}: missing path'
              assert 'access' in entry, f'{fid}: missing access'
              assert 'format' in entry, f'{fid}: missing format'
          print(f'Catalog OK: {len(catalog[\"files\"])} entries')
          "

      - name: Validate template requires reference catalog
        run: |
          python -c "
          import yaml
          from pathlib import Path
          with open('data_catalog.yaml') as f:
              catalog = yaml.safe_load(f)
          catalog_ids = set(catalog['files'].keys())
          errors = []
          for tmpl in Path('templates').rglob('*.yaml'):
              with open(tmpl) as f:
                  config = yaml.safe_load(f)
              for req in config.get('requires', []):
                  if req not in catalog_ids:
                      errors.append(f'{tmpl.name}: requires \"{req}\" not in catalog')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              raise SystemExit(1)
          print('All template requires reference valid catalog entries')
          "

      - name: Check for reproducibility tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match='legoesm-*' HEAD 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "::warning::No legoesm-* tag found at all. Run: bash scripts/sync_legoesm.sh --tag"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "ERROR: No legoesm-* tag exists. Reproducibility chain is broken."
              exit 1
            fi
          else
            REPRO_CHANGES=$(git diff --name-only "$LAST_TAG"...HEAD -- \
              'patches/' 'templates/' 'runners/' 'scripts/' \
              'legoESM_version.txt' 'data_catalog.yaml' 2>/dev/null || true)
            if [ -n "$REPRO_CHANGES" ]; then
              echo "::warning::Reproducibility-affecting changes since $LAST_TAG require a new tag."
              echo "  Changed files:"
              echo "$REPRO_CHANGES" | while read -r f; do echo "    $f"; done
              echo "  Run: bash scripts/sync_legoesm.sh --tag-only [--push]"
              if [ "${{ github.event_name }}" = "push" ]; then
                echo ""
                echo "ERROR: Reproducibility-affecting changes on main without a new legoesm-* tag."
                echo "Reproducibility chain is broken — experiment.tag would record runner_tag=untagged."
                exit 1
              fi
            else
              echo "No reproducibility-affecting changes since $LAST_TAG. Tag not required."
            fi
          fi

      - name: Remind to tag on reproducibility-affecting changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGES=$(git diff --name-only origin/main...HEAD -- 'patches/' 'templates/' 'runners/' 2>/dev/null || true)
          if [ -n "$CHANGES" ]; then
            echo "::notice::This PR modifies reproducibility-affecting paths. A legoesm-* tag must be created after merge."
            echo "  Affected files:"
            echo "$CHANGES" | while read -r f; do echo "    $f"; done
            echo "  After merge, run: bash scripts/sync_legoesm.sh --tag-only [--push]"
          fi

  # Tier 2: Full validation against legoESM (public repo — no PAT needed)
  validate-against-legoesm:
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml

      - name: Read pinned legoESM version
        id: legoesm
        run: |
          REF=$(grep '^ref:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          COMMIT=$(grep '^commit:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout legoESM
        uses: actions/checkout@v4
        with:
          repository: climate-federation/legoESM
          ref: ${{ steps.legoesm.outputs.commit }}
          path: legoESM
          fetch-depth: 0

      - name: Apply patches (if any)
        run: bash scripts/apply_patches.sh --check || true

      - name: Install legoESM + JAX
        # Bare `pip install -e legoESM/` cannot resolve the uv workspace
        # federation layout — use legoESM's own installer (proven on
        # bigfoot, see the experiments how-to). No continue-on-error: the
        # gate must be able to fail.
        run: |
          cd legoESM
          python scripts/experiment/install_federation.py --all
          pip install jax jaxlib

      - name: Validate templates against legoESM (full)
        run: python scripts/validate_templates.py --legoesm-dir legoESM --verbose

      - name: Run smoke test (one template)
        run: |
          python scripts/init_experiment.py 1d/ocean_scm --name ci_smoke_test \
              --output-dir ./ci_smoke_test

  # Scheduled check for legoESM updates (public repo — no PAT needed)
  sync-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Check for legoESM updates
        run: |
          PINNED=$(grep '^commit:' legoESM_version.txt | cut -d: -f2 | tr -d ' ')
          LATEST=$(git ls-remote https://github.com/climate-federation/legoESM.git refs/heads/main | cut -f1)
          echo "Pinned:  $PINNED"
          echo "Latest:  $LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning::legoESM has been updated. Run scripts/sync_legoesm.sh and validate templates."
          fi
